name: Compilar APK CamaraAuto2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK Debug
        run: |
          DIR_PROYECTO=$(find ./Camara/CamaraAuto2 -name "settings.gradle*" -printf "%h\n" | head -n 1)
          echo "Compilando en: $DIR_PROYECTO"
          cd "$DIR_PROYECTO"
          gradle assembleDebug

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: CamaraAuto2-debug
          path: Camara/CamaraAuto2/**/app/build/outputs/apk/debug/app-debug.apk