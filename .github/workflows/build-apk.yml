name: Compilar APK AlfredMovil

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x ./AlfredMovil/gradlew

      - name: Compilar APK Debug
        working-directory: ./AlfredMovil
        run: ./gradlew assembleDebug

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: AlfredMovil-debug
          path: AlfredMovil/app/build/outputs/apk/debug/app-debug.apk