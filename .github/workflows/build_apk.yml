name: Compilar AlfredMovil APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: chmod +x ./AlfredMovil/gradlew
      - name: Compilar APK
        working-directory: ./AlfredMovil
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AlfredMovil-APK
          path: AlfredMovil/app/build/outputs/apk/debug/app-debug.apk
